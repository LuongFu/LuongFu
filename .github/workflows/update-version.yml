name: Update Profile Version

on:
  schedule:
    - cron: "5 17 * * *" # 00:05 Vietnam time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version
        run: |
          python3 << 'EOF'
          from datetime import date
          import re

          today = date.today()

          birth_year = 2005
          birth_month = 12
          birth_day = 10

          age = today.year - birth_year

          # Chưa tới sinh nhật thì chưa tăng tuổi
          if (today.month, today.day) < (birth_month, birth_day):
              age -= 1

          # Tháng sinh nhật bắt đầu từ .0
          if today.month == birth_month and today.day >= birth_day:
              version_month = 0
          elif today.month > birth_month:
              version_month = today.month - birth_month
          else:
              version_month = 12 - birth_month + today.month

          version = f"{age}.{version_month}"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r'<!--START_VERSION-->.*?<!--END_VERSION-->',
              f'<!--START_VERSION-->{version}<!--END_VERSION-->',
              content
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Version: {version}")
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git diff --cached --quiet && exit 0

          git commit -m "chore: update profile version"
          git push
